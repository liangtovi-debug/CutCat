[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-edit-prototype"
version = "0.7.0.dev0"
description = "Independent native desktop video editing prototype (working name)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.8.3", "numpy==2.2.4", "fonttools==4.61.1", "Pillow==13.0.0", "regex==2026.9.29"]

[project.optional-dependencies]
agents = ["openai-agents==0.24.0"]
search = ["onnxruntime==1.22.1", "tokenizers==0.21.4"]
tts = ["sherpa-onnx==1.12.26", "sherpa-onnx-core==1.12.26"]
test = ["pytest==8.3.5"]
build = ["meson==1.8.3", "ninja==1.11.1.4", "pyinstaller==6.12.0", "pyinstaller-hooks-contrib==2025.1"]

[project.gui-scripts]
lumen-edit = "lumen.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
lumen = ["assets/licenses/**/*.txt", "assets/licenses/**/*.md", "assets/licenses/**/LICENSE", "assets/sounds/*.wav", "assets/sounds/*.json", "assets/sounds/*.txt", "assets/sounds/*.md", "assets/sounds/licenses/*.txt", "assets/sounds/licenses/*.json", "assets/app/*.png", "assets/app/*.ico", "assets/app/*.icns", "assets/app/*.json", "assets/ui/*.svg", "assets/stickers/**/*.png", "assets/stickers/**/*.json", "assets/stickers/**/*.md", "assets/stickers/*.png", "assets/stickers/*.json", "assets/stickers/*.md", "assets/stickers/*.txt", "assets/stickers/**/*.txt"]
