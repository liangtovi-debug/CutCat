name: Windows targeted runtime diagnostics
# Manual, scoped evidence only; never package or claim full regression success.
# Verify current included quota and the account's zero-paid-usage stop first.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-draft-validation
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned test dependencies
        timeout-minutes: 5
        run: python -m pip install -e ".[test,build]"
      - name: Build and verify caption shaping runtime
        timeout-minutes: 7
        run: python scripts/provision_caption_runtime.py --build --report build/caption-runtime.json
      - name: Provision the same pinned Windows FFmpeg
        timeout-minutes: 5
        run: python scripts/provision_ffmpeg.py --install --report build/ffmpeg-provenance.json
      - name: Provision independent frozen-oracle FFmpeg 7
        timeout-minutes: 5
        run: python scripts/provision_frozen_reference.py --report build/reference-ffmpeg-provenance.json
      - name: Provision the same licensed test font
        timeout-minutes: 5
        run: python scripts/provision_test_font.py --download --report build/test-font-provenance.json
      - name: Verify isolated historical code and production final-frame integration
        timeout-minutes: 55
        run: python scripts/run_bounded_tests.py tests/test_final_frame_preview_oracle.py tests/test_production_final_frame.py tests/test_final_frame_oracle_environment.py tests/test_frozen_range_environment.py tests/test_test_font_provisioning.py --output build/affine-diagnostics --workers 1 --target-nodes 40 --collection-timeout 60 --shard-timeout 1500 --suite-timeout 3000
      - name: Retain private diagnostic evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: windows-affine-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/caption-runtime.json
            build/ffmpeg-provenance.json
            build/reference-ffmpeg-provenance.json
            build/test-font-provenance.json
            build/ui-test-failures/
            build/affine-diagnostics/**/*.json
            build/affine-diagnostics/**/*.jsonl
            build/affine-diagnostics/**/*.xml
            build/affine-diagnostics/**/*.png
            build/affine-diagnostics/**/*.log
            build/affine-diagnostics/**/nodes.txt
            !build/affine-diagnostics/**/tmp/**
            !build/affine-diagnostics/**/cache/**
