name: Windows same-runtime v25 contrast evidence
# Manual only. Verify account $0 stop and remaining included quota before dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-draft-validation
  cancel-in-progress: false
jobs:
  compare:
    if: ${{ github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original NumPy version
        timeout-minutes: 4
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.4 pytest==8.3.5
      - name: Retrieve verified private historical archive
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_contrast_v25_archive.py --output build/private-v25.zip
      - name: Record starting source identity
        run: python -c "import json; from pathlib import Path; from scripts.source_provenance import capture_source_provenance; Path('build/source-before.json').write_text(json.dumps(capture_source_provenance(Path.cwd()),indent=2))"
      - name: Compare actual old and current implementations bit for bit
        timeout-minutes: 7
        run: python scripts/compare_contrast_v25_native.py --archive build/private-v25.zip --output build/contrast-native
      - name: Diagnose original caption bootstrap independently
        timeout-minutes: 1
        run: python scripts/diagnose_contrast_collection.py --output build/contrast-bootstrap.json
      - name: Verify integrated compatibility and fail-closed oracle tests
        timeout-minutes: 3
        run: python scripts/run_bounded_tests.py tests/test_contrast_pivot.py tests/test_native_contrast_oracle.py --output build/contrast-tests --workers 1 --target-nodes 200 --collection-timeout 30 --shard-timeout 90 --suite-timeout 120
      - name: Verify unchanged source identity
        if: always()
        run: python -c "import json; from pathlib import Path; from scripts.source_provenance import capture_source_provenance; p=capture_source_provenance(Path.cwd()); Path('build/source-after.json').write_text(json.dumps(p,indent=2)); assert p==json.loads(Path('build/source-before.json').read_text())"
      - name: Retain private synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-contrast-native
          retention-days: 7
          if-no-files-found: error
          path: |
            build/contrast-native/summary.json
            build/contrast-native/archive-manifest.json
            build/contrast-native/*.runtime.json
            build/contrast-native/*.npz
            build/private-v25.receipt.json
            build/source-before.json
            build/source-after.json
            build/contrast-bootstrap.json
            build/contrast-tests/collection/pytest.log
            build/contrast-tests/shard-*/pytest.log
            build/contrast-tests/**/*.json
            build/contrast-tests/**/*.jsonl
            build/contrast-tests/**/*.xml
            build/contrast-tests/**/nodes.txt
            !build/contrast-tests/**/tmp/**
            !build/contrast-tests/**/cache/**
